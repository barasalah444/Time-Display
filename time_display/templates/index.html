<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date and Time</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h3>The current time and date:</h3>
        <div style="border: 2px solid black; display: inline-block; padding: 20px 40px; margin-top: 10px;">
            <h1>{{ date }}</h1>
            <h1>{{ time }}</h1>
        </div>
    </div>
</body>
</html>
